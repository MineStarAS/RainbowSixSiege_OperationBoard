name: r6soperationboard
description: Rainbow Six Siege Operation Board
publish_to: 'none'
version: 1.2.0

environment:
  sdk: ">=2.17.6 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  unicons: ^3.0.0
  cupertino_icons: ^1.0.8
  arrow_path: ^3.1.0
  url_launcher: ^6.3.2
  desktop_window: ^0.4.2
  photo_view: ^0.15.0
  utility_yaml: ^1.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/map/
    - assets/operator/attack/
    - assets/operator/defense/
    - assets/gadget/operator/
    - assets/gadget/public/
    - assets/language/