name: RainbowSixSiege_OperationBoard
description: Rainbow Six Siege Operation Board
publish_to: 'none'
version: 1.1.0

environment:
  sdk: ">=2.17.6 <3.0.0"
dependencies:
  flutter:
    sdk: flutter
  unicons: ^2.1.0
  cupertino_icons: ^1.0.2
  arrow_path: ^2.0.0
  url_launcher: ^6.1.5
  desktop_window: ^0.4.0
  photo_view: ^0.14.0
  utility_yaml: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/map/
    - assets/operator/attack/
    - assets/operator/defense/
    - assets/gadget/operator/
    - assets/gadget/public/
    - assets/language/